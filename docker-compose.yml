version: '3.9'

services:
  app:
    build: .
    container_name: drone-ej-app
    env_file:
      - .env
    command: python -m app.main
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    container_name: drone-ej-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: drone-ej-postgres
    environment:
      POSTGRES_DB: drone_ej
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
